<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAVBAT Business</title><style>body{font-family:Inter,system-ui;background:#eef3fb;margin:0;color:#152033}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 6px 20px #0000000b}.row{display:flex;gap:12px;align-items:center}.grow{flex:1}button,input{font:inherit;padding:11px;border-radius:10px;border:1px solid #d8e0ee}button{cursor:pointer;border:0;background:#1769ff;color:#fff}.danger{background:#e34b4b}.muted{color:#68758a}.big{font-size:32px;font-weight:800}.pill{padding:6px 10px;border-radius:999px;background:#eaf1ff;color:#1769ff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><h1>NAVBAT Business</h1><div id="login" class="card"><h2>Tashkilot uchun kirish</h2><input id="email" value="demo@navbat.uz"><input id="pass" type="password" value="123456"><button onclick="login()">Kirish</button><p class="muted">Demo: demo@navbat.uz / 123456</p></div><div id="app" hidden><div class="card"><div class="row"><div class="grow"><b id="orgName"></b><div class="muted">Real-time navbat boshqaruvi</div></div><button onclick="load()">Yangilash</button></div></div><div class="grid"><div class="card"><div class="muted">Kutayotganlar</div><div id="count" class="big">0</div></div><div class="card"><div class="muted">Hozirgi xizmat</div><div id="current" class="big">—</div></div><div class="card"><button style="width:100%;height:55px;font-size:18px" onclick="next()">▶ Keyingi mijoz</button></div></div><div id="list"></div></div></div><script>let me=null;async function api(u,o){let r=await fetch(u,o);let j=await r.json();if(!r.ok)throw Error(j.error||'Xatolik');return j}async function login(){try{me=(await api('/api/org/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:pass.value})})).employee;loginBox();load()}catch(e){alert(e.message)}}function loginBox(){document.getElementById('login').hidden=true;document.getElementById('app').hidden=false}async function load(){let j=await api('/api/queue/org/'+me.orgId);orgName.textContent=j.org.name;count.textContent=j.queues.length;list.innerHTML=j.queues.map(q=>`<div class="card"><div class="row"><div class="grow"><b>№ ${q.number} — ${q.service}</b><div class="muted">Foydalanuvchi: ${q.userId.slice(0,6)}…</div></div><span class="pill">Kutilmoqda</span><button class="danger" onclick="complete('${q.id}')">Yakunlash</button></div></div>`).join('')||'<div class="card">Hozir kutayotgan mijoz yo‘q.</div>'}async function next(){try{let j=await api('/api/org/next',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orgId:me.orgId})});current.textContent='№ '+j.queue.number;load()}catch(e){alert(e.message)}}async function complete(id){await api('/api/org/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({queueId:id})});load()}setInterval(()=>{if(me)load()},3000)</script></body></html>
